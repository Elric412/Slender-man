name: Apply render ownership wiring

on:
  push:
    branches:
      - render/night-shadow-wiring

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.head_commit.message == 'run render wiring migration'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch without third-party actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$GITHUB_WORKSPACE"
          git init
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Apply render ownership migration
        run: node tools/apply-render-wiring.mjs
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Commit transformed source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts
          git diff --cached --quiet && { echo "No migration changes to commit"; exit 0; }
          git commit -m "wire NightLighting and ShadowQuality into runtime"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:render/night-shadow-wiring
