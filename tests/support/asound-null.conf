# STATIC — headless ALSA configuration for CI / sandbox test runs.
#
# The test machine has no sound card: no PulseAudio daemon and no ALSA plugin
# libraries (/usr/lib/*/alsa-lib is empty). Chromium's audio service still opens
# a real output stream, falls back to ALSA, finds nothing that can consume the
# samples, and its render callback then times out indefinitely —
#
#   audio_manager_linux.cc] Falling back to ALSA ... could not be initialized
#   sync_reader.cc] SyncReader::Read timed out, audio glitch count=10
#   sync_reader.cc] ASR: No room in socket buffer.: Broken pipe (32)
#
# — which wedges browser teardown, so audio tests die on
# `browserContext.close: Test ended.` *after* their assertions have passed.
#
# `type null` is compiled into libasound core (snd_pcm_null_open), so it works
# with no plugin .so on disk. Pointing the default PCM straight at it gives
# Chromium a device that accepts and discards samples. The Web Audio graph is
# still pulled at the normal rate, so AudioContext reaches 'running',
# AudioWorklets execute and AnalyserNode meters read real values — we simply
# never touch hardware.
#
# Deliberately standalone: including the stock /usr/share/alsa/alsa.conf drags
# in card-0 lookups (snd_func_card_inum) that fail on a machine with no cards
# and abort evaluation before the override is reached, leaving "Unknown PCM
# default". Defining the few nodes we need outright avoids that entirely.
#
# Selected via ALSA_CONFIG_PATH — see playwright.config.ts.

pcm.!default {
  type null
}

ctl.!default {
  type shm
  server "default"
}

pcm.null {
  type null
}
